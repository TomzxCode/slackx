site_name: slackx
site_description: Documentation for slackx, a tool to cache Slack threads to a local SQLite database
site_url: https://tomzxcode.github.io/slackx
repo_name: TomzxCode/slackx
repo_url: https://github.com/TomzxCode/slackx
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Open Sans
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - User Guide:
    - Getting started: user-guide/getting-started.md
    - Fetching threads: user-guide/fetching-threads.md
    - Fetching channel messages: user-guide/fetching-channel-messages.md
    - Searching messages: user-guide/searching.md
    - Caching users: user-guide/caching-users.md
    - Caching channels: user-guide/caching-channels.md
    - Serving the web UI: user-guide/serving.md
    - JSON-RPC API: user-guide/json-rpc.md
    - Tracking last read: user-guide/tracking-last-read.md
    - Configuration: user-guide/configuration.md
    - CLI reference: user-guide/cli-reference.md
  - Developer Guide:
    - Fake Slack server: developer-guide/fake-slack-server.md
  - Context:
    - Project overview: sdlc/context/project-overview.md
    - Use cases: sdlc/context/use-cases.md
    - Architecture: sdlc/context/architecture.md
    - Conventions: sdlc/context/conventions.md
    - Vocabulary: sdlc/context/vocabulary.md
    - Infrastructure: sdlc/context/infrastructure.md
    - Observability: sdlc/context/observability.md
  - Features:
    - Thread caching:
      - Requirements: sdlc/features/p1-thread-caching/requirements.md
      - Specification: sdlc/features/p1-thread-caching/specification.md
    - User caching:
      - Requirements: sdlc/features/p2-user-caching/requirements.md
      - Specification: sdlc/features/p2-user-caching/specification.md
    - Channel caching:
      - Requirements: sdlc/features/p3-channel-caching/requirements.md
      - Specification: sdlc/features/p3-channel-caching/specification.md
    - Configuration:
      - Requirements: sdlc/features/p4-config-credentials/requirements.md
      - Specification: sdlc/features/p4-config-credentials/specification.md
    - URL parsing:
      - Requirements: sdlc/features/p5-url-parsing/requirements.md
      - Specification: sdlc/features/p5-url-parsing/specification.md
    - Channel message fetching:
      - Requirements: sdlc/features/p6-channel-message-fetching/requirements.md
      - Specification: sdlc/features/p6-channel-message-fetching/specification.md
    - Fake Slack server:
      - Requirements: sdlc/features/p7-fake-slack-server/requirements.md
      - Specification: sdlc/features/p7-fake-slack-server/specification.md
    - Per-workspace database:
      - Requirements: sdlc/features/p8-per-workspace-database/requirements.md
      - Specification: sdlc/features/p8-per-workspace-database/specification.md

exclude_docs: |
  sdlc/templates/

not_in_nav: |
  sdlc/features/*/progress.md
  sdlc/features/*/tests.md
  sdlc/features/*/propagation-report.md
  sdlc/features/p*-*/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

plugins:
  - search
  - social

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TomzxCode/slackx
